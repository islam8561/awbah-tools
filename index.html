<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7a2140">
<title>قوالب منشورات أوبة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@600;800;900&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: هادئ، محترم، مثل مطبوعة دينية أنيقة
   IDEA: طاولة الطباعة؛ البطاقة الجاهزة هي الصورة الرئيسية
   PICTURE: معاينة المنشور كبيرة بجوار الحقول
   COLOUR and TYPE: عنابي عميق + كريمي + ذهبي خافت؛ Cairo للعناوين وAmiri للنص
   LAYOUT: عمود حقول + معاينة، وتتكدس على الموبايل */
:root{color-scheme:light dark;--bg:light-dark(#f5eee4,#1d1216);--card:light-dark(#fffaf3,#2a1a20);--ink:light-dark(#2b1a20,#f3e8dc);--mute:light-dark(#7a6168,#bba6a9);--acc:#7a2140;--line:light-dark(#e3d5c4,#4a2f37)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Cairo",system-ui,sans-serif;overflow-x:clip}
header{padding:22px max(5vw,16px) 6px}
h1{font:900 clamp(26px,4vw,40px)/1.1 "Cairo";margin:0 0 4px}
header p{margin:0;color:var(--mute)}
main{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:28px;padding:18px max(5vw,16px) 40px;max-width:1240px}
@media(max-width:860px){main{grid-template-columns:minmax(0,1fr)}.prev{order:-1}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px;align-content:start}
label{display:grid;gap:5px;font-weight:600;font-size:14px}
input[type=text],textarea,select{font:16px/1.6 "Noto Naskh Arabic",serif;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
textarea{min-height:120px;resize:vertical}
small{color:var(--mute);font-weight:400;font-size:13px}
.styles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}@media(max-width:520px){.styles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.styles button span{background:rgba(255,255,255,.92);color:#2b1a20;border-radius:8px;padding:2px 8px;display:inline-block}.styles button{min-height:72px;border-radius:12px;border:2px solid var(--line);font:700 14px "Cairo";cursor:pointer;color:#fff;padding:6px}
.styles button[aria-pressed=true]{border-color:var(--ink);outline:3px solid var(--acc);outline-offset:2px}
.sA{background:linear-gradient(#7a2140 55%,#f4ece0 55%)}.sB{background:linear-gradient(135deg,#e9b8ad,#b9c8b5,#8fa6ad);color:#2f4448!important}.sC{background:linear-gradient(#0d1d6b,#2a3fa8)}.sD{background:linear-gradient(#e9e8e4 45%,#2e7d57 45%);color:#1d5c40!important}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:0;background:var(--acc);color:#fff;font:700 15px "Cairo";cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #c9a227;outline-offset:2px}
.prev{display:grid;gap:12px;align-content:start;position:sticky;top:12px}
@media(max-width:860px){.prev{position:static}}
#out{width:100%;max-width:560px;height:auto;border-radius:12px;box-shadow:0 12px 40px rgba(60,20,30,.25);display:block;margin-inline:auto}
#msg{min-height:1.4em;color:var(--mute);font-size:14px;text-align:center}
@media(max-width:860px){.bar{position:fixed;bottom:0;inset-inline:0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.12)}.bar .btn{flex:1}body{padding-bottom:84px}}
.peek{display:none}@media(max-width:860px){.peek{display:inline-block}}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:700;min-height:32px}
pre{white-space:pre-wrap;direction:ltr;text-align:left;font:13px/1.5 ui-monospace,monospace;background:var(--bg);padding:10px;border-radius:10px;border:1px solid var(--line)}
</style>
</head>
<body>
<header>
<h1>قوالب منشورات «أوبة»</h1>
<p>اكتب النص، اختار الستايل، وضيف خلفية لو حابب — والصورة تطلع جاهزة بخط عربي وتشكيل مضبوط.</p>
</header>
<main>
<section class="panel" aria-label="المحتوى">
<div>
<div style="font-weight:600;font-size:14px;margin-bottom:6px">الستايل</div>
<div class="styles" id="styles">
<button class="sA" data-s="A" aria-pressed="true"><span>بطاقة حديث</span></button>
<button class="sB" data-s="B" aria-pressed="false"><span>هادئ مائي</span></button>
<button class="sC" data-s="C" aria-pressed="false"><span>لوحة ليلية</span></button>
<button class="sD" data-s="D" aria-pressed="false"><span>جدول مواعيد</span></button>
</div>
</div>
<div id="dBox" hidden style="display:grid;gap:10px">
<div style="font-weight:600;font-size:14px">قوالب جاهزة <small>بتملا كل الحقول، وراجع التواريخ مع إعلان دار الإفتاء</small></div>
<div class="row"><button class="btn" id="pBid" type="button">الأيام البيض الجاية</button><button class="btn ghost" id="pMT" type="button">الاثنين والخميس</button></div>
<label>مكان الصورة
<select id="imgpos"><option value="bottom">مشهد تحت النص (زي التمر والمية)</option><option value="side">جنب العنوان</option></select></label>
<label>صفوف الجدول <small>كل سطر صف، وافصل الخانات بعلامة |</small><textarea id="rows" style="min-height:110px"></textarea></label>
</div>
<label>العنوان <input type="text" id="title"></label>
<label>المقدّمة / الراوي <small>اختياري</small><input type="text" id="intro"></label>
<label>النص الرئيسي <small>انسخ الحديث أو الآية كما هي، وتقدر تكسر السطر بنفسك</small><textarea id="main"></textarea></label>
<label>المصدر <input type="text" id="src"></label>
<label>كلمات تتلوّن <small>افصل بينها بفاصلة</small><input type="text" id="hl"></label>
<div class="row">
<label style="flex:1">المقاس
<select id="size"><option value="1350">4:5 (إنستجرام وفيسبوك)</option><option value="1080">1:1 مربع</option><option value="1920">9:16 ستوري</option></select></label>
</div>
<label>صورة الخلفية / الرسمة <small>اختياري — اعملها بالبرومبت تحت من غير كتابة</small>
<input type="file" id="file" accept="image/*"></label>
<div class="row"><button class="btn ghost" id="clear" type="button">شيل الصورة</button></div>
<details>
<summary>برومبت الخلفية لهذا الستايل</summary>
<p style="margin:6px 0;font-size:14px;color:var(--mute)">بدّل الكلمة اللي بين الأقواس بموضوع المنشور، وحطه في Nano Banana أو GPT Image.</p>
<pre id="prompt"></pre>
<button class="btn ghost" id="copy" type="button">انسخ البرومبت</button>
</details>
</section>
<section class="prev" aria-label="المعاينة">
<img id="out" alt="معاينة المنشور">
<div class="row bar" style="justify-content:center"><button class="btn ghost peek" id="peek" type="button">المعاينة</button><button class="btn" id="save" type="button">حمّل الصورة</button><button class="btn" id="share" type="button" hidden>شارك</button></div>
<div id="msg"></div>
</section>
</main>
<canvas id="cv" hidden></canvas>
<script>

function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function cover(im,x,y,w,h){const s=Math.max(w/im.width,h/im.height),iw=im.width*s,ih=im.height*s;ctx.drawImage(im,x+(w-iw)/2,y+(h-ih)/2,iw,ih)}
function wrap(text,font,maxW){ctx.font=font;const out=[];for(const para of text.split('\n')){let line='';const tk=[];for(const w of para.split(/\s+/).filter(Boolean)){if(/^(هـ|ه|م)$/.test(w)&&tk.length)tk[tk.length-1]+='\u00a0'+w;else tk.push(w)}for(const w of tk){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t}if(line)out.push(line)}return out}
function fit(text,weight,fam,maxW,maxH,max,min,lh){let s=max,l;for(;s>=min;s-=2){l=wrap(text,F(weight,s,fam),maxW);if(l.length*s*lh<=maxH)break}return{size:Math.max(s,min),lines:l}}
function rich(lines,font,size,cx,y,lh,color,hlColor,mode){

 lines.forEach((line,i)=>{const ws=line.split(' '),wd=ws.map(w=>ctx.measureText(w).width);const tot=wd.reduce((a,b)=>a+b,0)+sp*(ws.length-1);let xr=cx+tot/2;const by=y+i*size*lh+size;
  ws.forEach((w,j)=>{const on=hl.has(strip(w));if(on&&mode==='bar'){ctx.fillStyle=hlColor;ctx.globalAlpha=.85;rr(xr-wd[j]-6,by-size*.42,wd[j]+12,size*.5,6);ctx.fill();ctx.globalAlpha=1}
   ctx.fillStyle=on&&mode!=='bar'?hlColor:color;ctx.fillText(w,xr,by);xr-=wd[j]+sp})});
 return y+lines.length*size*lh}

function busy(x,y,w,h){let worst=0,lum=0;for(let r=0;r<2;r++)for(let c=0;c<3;c++){const b=busy1(x+c*w/3,y+r*h/2,w/3,h/2);worst=Math.max(worst,b.score);lum+=b.lum/6}return{score:worst,lum}}
function busy1(x,y,w,h){x=Math.max(0,Math.round(x));y=Math.max(0,Math.round(y));w=Math.min(W-x,Math.round(w));h=Math.min(cv.height-y,Math.round(h));
 const d=ctx.getImageData(x,y,w,h).data,L=k=>.299*d[k]+.587*d[k+1]+.114*d[k+2];let s=0,n=0,lum=0;
 for(let yy=0;yy<h-4;yy+=3)for(let xx=0;xx<w-4;xx+=3){const k=(yy*w+xx)*4,l=L(k);lum+=l;s+=Math.abs(l-L(k+12))+Math.abs(l-L(k+w*12));n++}
 return{score:n?s/n:999,lum:n?lum/n/255:.5}}
function placeLogo(H){if(!pendingSign)return;const p=pendingSign;pendingSign=null;
 const c=[{cx:p.cx,y:p.y,def:1},{cx:W*.17,y:158},{cx:W*.83,y:158},{cx:W*.17,y:H-100},{cx:W*.83,y:H-100},{cx:W/2,y:H-100}];
 let best=null;for(const k of c){const b=busy(k.cx-108,k.y-86,216,140),sc=b.score*(k.def?.75:1);if(!best||sc<best.sc)best={...k,sc,lum:b.lum}}
 const light=best.lum>.55;drawSign(best.cx,best.y,p.c1,light?'rgba(45,45,45,.75)':'rgba(255,255,255,.85)',light?(p.mono||'#3d2a2f'):null)}
const v=id=>$(id).value.trim();
function drawA(H){
 const g=ctx.createRadialGradient(W*.7,H*.15,50,W*.5,H*.4,H*.9);g.addColorStop(0,'#8e2d4c');g.addColorStop(1,'#5a1730');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 const topH=H*.48;let tx=W/2,tw=W-160;
 if(img){const r=Math.min(topH*.42,250),cx=W*.3,cy=topH*.55;ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.clip();cover(img,cx-r,cy-r,r*2,r*2);ctx.restore();ctx.strokeStyle='rgba(222,190,130,.7)';ctx.lineWidth=6;ctx.beginPath();ctx.arc(cx,cy,r+8,0,7);ctx.stroke();tx=W*.74;tw=W*.44}
 const t=fit(v('title'),900,'Cairo',tw,topH*.62,104,48,1.2);let y=topH*.5-t.lines.length*t.size*1.2/2;rich(t.lines,F(900,t.size,'Cairo'),t.size,tx,y-t.size*.15,1.2,'#fff6ea','#e8c98a','');
 const px=60,py=topH+20,pw=W-120,ph=H-py-160;ctx.fillStyle='#f4ece0';rr(px,py,pw,ph,36);ctx.fill();
 let cy=py+44;if(v('intro')){const il=wrap(v('intro'),F(700,32,'Cairo'),pw-160);const ih=il.length*48+28;ctx.fillStyle='#6e1f3a';rr(W/2-(pw-100)/2,cy,pw-100,ih,18);ctx.fill();rich(il,F(700,32,'Cairo'),32,W/2,cy+6,1.5,'#fff6ea','#fff6ea','');cy+=ih+30}
 const m=fit(v('main'),800,'Cairo',pw-110,py+ph-cy-110,82,36,1.45);const mh=m.lines.length*m.size*1.45;rich(m.lines,F(800,m.size,'Cairo'),m.size,W/2,cy+(py+ph-cy-100-mh)/2,1.45,'#6e1f3a','#2f6b4f','');
 if(v('src')){ctx.font=F(700,28,'Cairo');const sw=ctx.measureText(v('src')).width+70;ctx.fillStyle='#6e1f3a';rr(W/2-sw/2,py+ph-82,sw,56,28);ctx.fill();center(v('src'),F(700,28,'Cairo'),'#fff6ea',W/2,py+ph-44)}
 sign(W/2,H-60,'#f4dfb8','rgba(244,223,184,.75)')}
function drawB(H){
 ctx.fillStyle='#f3efe9';ctx.fillRect(0,0,W,H);
 const sceneH=img?Math.round(H*.3):0;
 if(img){ctx.save();ctx.filter='blur(28px) saturate(.8)';cover(img,-60,-60,W+120,H+120);ctx.restore();ctx.fillStyle='rgba(246,241,233,.8)';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalAlpha=.95;ctx.drawImage(feather(W-112,sceneH,'bottom'),56,H-56-sceneH);ctx.restore()}
 else{ctx.save();ctx.filter='blur(70px)';[['#eab4a8',W*.15,H*.08,520,260],['#c9d4c4',W*.55,H*.5,560,300],['#8fa6ad',W*.95,H*.95,640,360],['#f0cfc6',W*.9,H*.2,300,200]].forEach(([c,x,y,a,b])=>{ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,a,b,-.5,0,7);ctx.fill()});ctx.restore()}
 ctx.strokeStyle='#4f6b70';ctx.lineWidth=4;ctx.strokeRect(56,56,W-112,H-112);
 const ink='#33494d';let y=img?262:150;
 if(v('title')){const t=wrap(v('title'),F(800,64,'Cairo'),W-220);y=rich(t,F(800,64,'Cairo'),64,W/2,y-60,1.35,'#4f6b70','#4f6b70','')+40}
 if(v('intro')){const il=wrap(v('intro'),F(700,36,'Amiri'),W-240);y=rich(il,F(700,36,'Amiri'),36,W/2,y,1.6,'#9a5a4c','#9a5a4c','')+30}
 const bottom=H-(img?sceneH*.92:240)-(v('src')?(img?70:0):0);const m=fit(v('main'),400,'Amiri',W-240,bottom-y,64,30,1.75);const mh=m.lines.length*m.size*1.75;
 const end=rich(m.lines,F(400,m.size,'Amiri'),m.size,W/2,y+(bottom-y-mh)/2,1.75,ink,'#a5574a','');
 if(v('src'))center(v('src'),F(700,38,'Amiri'),ink,W/2,end+(img?50:70));
 sign(W/2,img?172:H-120,'#4f6b70','rgba(79,107,112,.75)','#3f5a5f')}
function drawC(H){
 if(img)cover(img,0,0,W,H);else{const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a1650');g.addColorStop(1,'#2236a0');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
 const sh=ctx.createLinearGradient(0,H*.35,0,H);sh.addColorStop(0,'rgba(8,12,50,0)');sh.addColorStop(1,'rgba(8,12,50,.85)');ctx.fillStyle=sh;ctx.fillRect(0,0,W,H);
 const mainF=fit(v('main'),700,'Amiri',W-200,H*.24,54,30,1.6);const tl=wrap(v('title'),F(900,92,'Cairo'),W-200);
 const blockH=tl.length*92*1.2+(v('intro')?60:0)+mainF.lines.length*mainF.size*1.6+(v('src')?70:0);let y=H-200-blockH;
 if(v('title')){ctx.font=F(900,92,'Cairo');tl.forEach((l,i)=>{const w=ctx.measureText(l).width,by=y+i*110+92;ctx.fillStyle='rgba(139,111,214,.85)';rr(W/2-w/2-16,by-50,w+32,62,10);ctx.fill()});y=rich(tl,F(900,92,'Cairo'),92,W/2,y,1.2,'#fff','#fff','')+18}
 if(v('intro')){center(v('intro'),F(700,30,'Cairo'),'rgba(255,255,255,.8)',W/2,y+36);y+=60}
 ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W*.3,y);ctx.lineTo(W*.7,y);ctx.stroke();
 y=rich(mainF.lines,F(700,mainF.size,'Amiri'),mainF.size,W/2,y+8,1.6,'#fff','#8b6fd6','bar');
 if(v('src'))center('— '+v('src'),F(700,30,'Amiri'),'rgba(255,255,255,.8)',W/2,y+54);
 sign(W/2,H-90,'#fff','rgba(255,255,255,.7)')}
function contain(im,x,y,w,h){const s=Math.min(w/im.width,h/im.height),iw=im.width*s,ih=im.height*s;ctx.drawImage(im,x+(w-iw)/2,y+(h-ih)/2,iw,ih)}
function imgBg(){if(img._bg)return img._bg;const c=document.createElement('canvas');c.width=c.height=24;const x=c.getContext('2d');x.drawImage(img,0,0,24,24);const d=x.getImageData(0,0,24,24).data;let r=0,g=0,b=0,n=0;
 for(const[px,py]of[[0,0],[23,0],[0,1],[23,1],[1,0],[22,0]]){const i=(py*24+px)*4;r+=d[i];g+=d[i+1];b+=d[i+2];n++}r/=n;g/=n;b/=n;
 return img._bg={css:`rgb(${r|0},${g|0},${b|0})`,l:(.299*r+.587*g+.114*b)/255,a:d[3]}}
function feather(w,h,mode){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
 const s=mode==='side'?Math.min(w/img.width,h/img.height):Math.max(w/img.width,h/img.height),iw=img.width*s,ih=img.height*s;
 x.drawImage(img,(w-iw)/2,mode==='side'?(h-ih)/2:(h-ih)*.55,iw,ih);x.globalCompositeOperation='destination-out';
 const fade=(x0,y0,x1,y1,rx,ry,rw,rh)=>{const g=x.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(rx,ry,rw,rh)};
 const fx=mode==='side'?.16:.1,ft=mode==='side'?.16:.42,fb=mode==='side'?.16:0;
 fade(0,0,w*fx,0,0,0,w*fx,h);fade(w,0,w*(1-fx),0,w*(1-fx),0,w*fx,h);fade(0,0,0,h*ft,0,0,w,h*ft);if(fb)fade(0,h,0,h*(1-fb),0,h*(1-fb),w,h*fb);return c}
function drawD(H){
 const ib=img?imgBg():null,bg=ib&&ib.a>200&&ib.l>.55?ib.css:'#e9e8e4';
 ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(60,60,60,.7)';ctx.lineWidth=3;ctx.strokeRect(36,36,W-72,H-72);
 const pos=v('imgpos')||'bottom',side=img&&pos==='side',scene=img&&pos==='bottom',sceneH=scene?Math.round(H*.28):0;
 if(scene)ctx.drawImage(feather(W-80,sceneH,'bottom'),40,H-40-sceneH);
 const top=78,headH=H*(scene?.25:.31);let tx=W/2,tw=W-200;
 if(side){const bw=W*.42,bh=headH-top+30;ctx.drawImage(feather(Math.round(bw),Math.round(bh),'side'),56,top-10);tx=W*.72;tw=W*.48}
 if(scene){tx=W*.585;tw=W*.66;sign(W*.135,top+90,'#1f6b4a','rgba(31,107,74,.8)','#1d5c40')}
 const avail=headH-top,hasI=!!v('intro');
 const t=fit(v('title'),900,'Cairo',tw,avail*(hasI?.64:.92),100,40,1.32);
 const iF=hasI?fit(v('intro'),800,'Cairo',tw,avail*.3,58,26,1.4):{size:0,lines:[]};
 const gap=hasI?t.size*.18:0,bh=t.lines.length*t.size*1.32+gap+iF.lines.length*iF.size*1.4;let y=top+(avail-bh)/2-t.size*.22;
 y=rich(t.lines,F(900,t.size,'Cairo'),t.size,tx,y,1.32,'#1f6b4a','#1f6b4a','')+gap;
 if(iF.lines.length)rich(iF.lines,F(800,iF.size,'Cairo'),iF.size,tx,y,1.4,'#2b2b2b','#2b2b2b','');
 const rows=v('rows').split('\n').map(r=>r.split('|').map(c=>c.trim()).filter(Boolean)).filter(r=>r.length);
 y=headH+26;
 if(rows.length){const g=12,rh=Math.min(108,(H*(scene?.25:.3))/rows.length-g),tX=64,tW=W-128;
  rows.forEach(r=>{const n=r.length,ws=n===1?[1]:[.24,...Array(n-1).fill(.76/(n-1))];let x=tX+tW;
   r.forEach((c,i)=>{const w=tW*ws[i]-(i<n-1?g:0);ctx.fillStyle=i===0?'#1d5c40':'#2e7d57';rr(x-w,y,w,rh,10);ctx.fill();
    let fs=Math.round(rh*.44);ctx.font=F(800,fs,'Cairo');while(ctx.measureText(c).width>w-28&&fs>18){fs-=2;ctx.font=F(800,fs,'Cairo')}
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.direction='rtl';ctx.textBaseline='middle';ctx.fillText(c,x-w/2,y+rh/2+2);ctx.textBaseline='alphabetic';x-=w+g});
   y+=rh+g});y+=18}
 const bottom=H-(scene?sceneH*.95:170)-(v('src')?62:0);const m=fit(v('main'),700,'Amiri',W-170,bottom-y,54,26,1.62);const mh=m.lines.length*m.size*1.62;
 const end=rich(m.lines,F(700,m.size,'Amiri'),m.size,W/2,y+Math.max(0,(bottom-y-mh)/2),1.62,'#222','#1f6b4a','');
 if(v('src')){ctx.font=F(700,30,'Amiri');const sw=ctx.measureText(v('src')).width+60;ctx.fillStyle='rgba(0,0,0,.08)';rr(W/2-sw/2,end+12,sw,50,10);ctx.fill();center(v('src'),F(700,30,'Amiri'),'#444',W/2,end+46)}
 if(!scene)sign(W/2,H-90,'#1f6b4a','rgba(31,107,74,.75)','#1d5c40')}
// ---- حساب التواريخ
const hij=d=>{const p=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'numeric',year:'numeric'}).formatToParts(d);const g=t=>+p.find(x=>x.type===t).value;return{d:g('day'),m:g('month'),y:parseInt(p.find(x=>x.type==='year').value)}};
const hMonth=d=>new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',{month:'long'}).format(d).replace('جمادى الآخرة','جمادى الثانية').replace('ربيع الآخر','ربيع الثاني');
const dayName=d=>new Intl.DateTimeFormat('ar-EG',{weekday:'long'}).format(d).replace('الاثنين','الإثنين');
const greg=d=>new Intl.DateTimeFormat('ar-EG-u-nu-latn',{day:'numeric',month:'long'}).format(d);
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
function today(){const d=new Date();d.setHours(12,0,0,0);return d}
function fillPreset(o){Object.entries(o).forEach(([k,val])=>$(k).value=val);render()}
let url=null;
function render(){
 const H=+$('size').value;cv.width=W;cv.height=H;ctx.clearRect(0,0,W,H);
 ({A:drawA,B:drawB,C:drawC,D:drawD})[style](H);placeLogo(H);
 $('dBox').hidden=style!=='D';$('dBox').style.display=style==='D'?'grid':'none';
 cv.toBlob(b=>{if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(b);$('out').src=url;$('out').dataset.blob='1';lastBlob=b},'image/png');
 $('prompt').textContent=prompts[style];
 document.querySelectorAll('#styles button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.s===style));
 try{const o={style,size:$('size').value};fields.forEach(f=>o[f]=$(f).value);localStorage.setItem('awbah-tpl',JSON.stringify(o))}catch(e){}}
let lastBlob=null,tm;
const later=()=>{clearTimeout(tm);tm=setTimeout(render,150)};
fields.forEach(f=>$(f).addEventListener('input',later));
$('size').addEventListener('change',render);$('imgpos').addEventListener('change',render);
$('pBid').addEventListener('click',()=>{let d=today();for(let i=0;i<40&&!(hij(d).d>=13&&hij(d).d<=15&&hij(addD(d,13-hij(d).d)).d===13);i++)d=addD(d,1);
 d=addD(d,13-hij(d).d);const rows=[0,1,2].map(i=>{const x=addD(d,i);return `${dayName(x)} | ${hij(x).d} ${hMonth(x)} | الموافق ${greg(x)}`}).join('\n');
 fillPreset({title:'نذكّركم بالأيام البيض',intro:'لشهر '+hMonth(d)+' '+hij(d).y+' هـ',rows,main:'قال رسول الله ﷺ:\n«صَوْمُ ثلاثةِ أيامٍ مِن كلِّ شهرٍ صَوْمُ الدَّهرِ كلِّه»',src:'متفق عليه',hl:'الدهر'})});
$('pMT').addEventListener('click',()=>{let d=today();const out=[];for(let i=0;i<8&&out.length<2;i++){const x=addD(d,i);if([1,4].includes(x.getDay()))out.push(x)}
 out.sort((a,b)=>a-b);const rows=out.map(x=>`${dayName(x)} | ${hij(x).d} ${hMonth(x)} | الموافق ${greg(x)}`).join('\n');
 fillPreset({title:'لا تنسَ صيام الاثنين والخميس',intro:'مواعيد هذا الأسبوع',rows,main:'قال رسول الله ﷺ:\n«تُعرَضُ الأعمالُ يومَ الاثنينِ والخميسِ، فأُحِبُّ أن يُعرَضَ عملي وأنا صائمٌ»',src:'رواه الترمذي',hl:'الاثنين, والخميس'})});
$('styles').addEventListener('click',e=>{const b=e.target.closest('button');if(b){style=b.dataset.s;render()}});
$('file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{img=im;render()};im.src=URL.createObjectURL(f)});
$('clear').addEventListener('click',()=>{img=null;$('file').value='';render()});
$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(prompts[style]);$('msg').textContent='اتنسخ البرومبت'}catch(e){$('msg').textContent='حدد النص وانسخه يدويًا'}});
$('save').addEventListener('click',()=>{
 if(!lastBlob)return;const name='awbah-'+(v('title')||'post').replace(/[^\u0600-\u06FFa-zA-Z0-9]+/g,'-').slice(0,40)+'.png';
 const a=document.createElement('a');a.href=URL.createObjectURL(lastBlob);a.download=name;document.body.appendChild(a);a.click();a.remove();$('msg').textContent='اتحفظت الصورة في التنزيلات'});

const fname=()=>'awbah-'+(v('title')||'post').replace(/[^\u0600-\u06FFa-zA-Z0-9]+/g,'-').slice(0,40)+'.png';
$('peek').addEventListener('click',()=>$('out').scrollIntoView({behavior:'smooth',block:'start'}));
try{if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[new File([new Blob(['x'])],'a.png',{type:'image/png'})]}))$('share').hidden=false}catch(e){}
$('share').addEventListener('click',async()=>{if(!lastBlob)return;try{await navigator.share({files:[new File([lastBlob],fname(),{type:'image/png'})]})}catch(e){if(e.name!=='AbortError')$('msg').textContent='المشاركة مش متاحة هنا، استخدم التحميل'}});
document.fonts.load(F(900,40,'Cairo'));document.fonts.load(F(800,40,'Cairo'));document.fonts.load(F(700,40,'Cairo'));document.fonts.load(F(400,40,'Amiri'));document.fonts.load(F(700,40,'Amiri'));
render();document.fonts.ready.then(()=>setTimeout(render,50));
}
